spring.config.import=optional:file:.env[.properties]
spring.cloud.config.enabled=false
server.port=${PORT:8091}
gestopago.auth.url=${GESTOPAGO_AUTH_URL}
gestopago.auth.id-distribuidor=${GESTOPAGO_AUTH_ID_DISTRIBUIDOR}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_AUTH_CODIGO_DISPOSITIVO}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
spring.datasource.url=${SPRING_DATASOURCE_URL}
gestopago.productos.url=${GESTOPAGO_PRODUCTOS_URL:${gestopago.auth.url}}
gestopago.productos.sync-cron=${GESTOPAGO_PRODUCTOS_SYNC_CRON:-}
gestopago.productos.cache-ttl-seconds=${GESTOPAGO_PRODUCTOS_CACHE_TTL_SECONDS:3600}
spring.cloud.openfeign.client.config.default.connect-timeout=${GESTOPAGO_CONNECT_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.default.read-timeout=${GESTOPAGO_READ_TIMEOUT_MS:30000}
gestopago.transacciones.url=${GESTOPAGO_TRANSACCIONES_URL:${gestopago.auth.url}}
gestopago.transacciones.llave-aes=${GESTOPAGO_TX_LLAVE_AES:}
gestopago.transacciones.iv-aes=${GESTOPAGO_TX_IV_AES:}
gestopago.transacciones.unidad=${GESTOPAGO_TX_UNIDAD:}
gestopago.transacciones.codigos-indeterminados=${GESTOPAGO_TX_CODIGOS_INDETERMINADOS:03,82}
gestopago.transacciones.codigos-no-aplicada=${GESTOPAGO_TX_CODIGOS_NO_APLICADA:70}
spring.cloud.openfeign.client.config.gestoPagoTransacciones.connect-timeout=${GESTOPAGO_CONNECT_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.gestoPagoTransacciones.read-timeout=${GESTOPAGO_TX_READ_TIMEOUT_MS:62000}

pagos.monto-minimo=${PAGOS_MONTO_MINIMO:1.00}
pagos.monto-maximo=${PAGOS_MONTO_MAXIMO:10000.00}
pagos.zona-horaria=${PAGOS_ZONA_HORARIA:America/Mexico_City}
pagos.conciliacion-intervalo-ms=${PAGOS_CONCILIACION_INTERVALO_MS:300000}
pagos.conciliacion-minutos-pendiente=${PAGOS_CONCILIACION_MINUTOS_PENDIENTE:5}
pagos.conciliacion-max-intentos=${PAGOS_CONCILIACION_MAX_INTENTOS:12}

segundo-factor.clave-cifrado=${SEGUNDO_FACTOR_CLAVE_CIFRADO:}
segundo-factor.emisor=${SEGUNDO_FACTOR_EMISOR:Onboarding}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5s}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.minutos-vigencia=30

spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:10s}

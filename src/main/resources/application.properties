spring.config.import=optional:file:.env[.properties]
spring.cloud.config.enabled=false
gestopago.auth.url=${GESTOPAGO_AUTH_URL}
gestopago.auth.id-distribuidor=${GESTOPAGO_AUTH_ID_DISTRIBUIDOR}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_AUTH_CODIGO_DISPOSITIVO}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
spring.datasource.url=${SPRING_DATASOURCE_URL}
gestopago.productos.url=${GESTOPAGO_PRODUCTOS_URL:${gestopago.auth.url}}
gestopago.productos.sync-cron=${GESTOPAGO_PRODUCTOS_SYNC_CRON:-}
gestopago.productos.cache-ttl-seconds=${GESTOPAGO_PRODUCTOS_CACHE_TTL_SECONDS:3600}
spring.cloud.openfeign.client.config.default.connect-timeout=${GESTOPAGO_CONNECT_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.default.read-timeout=${GESTOPAGO_READ_TIMEOUT_MS:30000}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5s}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.minutos-vigencia=30

spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:10s}
